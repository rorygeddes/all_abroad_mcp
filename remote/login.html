<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to AllAbroad</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #dbeafe 0%, #ede9fe 45%, #fce7f3 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #111827;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 700;
      color: #1d4ed8;
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-size: 15px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    /* Claude context note */
    .claude-note {
      font-size: 12.5px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 5px 14px;
    }

    /* Form card */
    .form-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Error / success boxes */
    .msg-box {
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      width: 100%;
    }
    .msg-box.visible { display: block; }
    .msg-box.error   { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .msg-box.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }

    /* Tab row */
    .tab-row {
      display: flex;
      background: rgba(0,0,0,0.06);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
      background: transparent;
      color: #6b7280;
    }

    .tab-btn.active {
      background: #fff;
      color: #1d4ed8;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    /* Inputs */
    .field {
      margin-bottom: 10px;
      width: 100%;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      color: #111827;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    input::placeholder { color: #9ca3af; }

    /* Primary button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #1d4ed8;
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 6px;
      margin-bottom: 16px;
      font-family: inherit;
    }

    .submit-btn:hover:not(:disabled) { background: #1e40af; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.12);
    }

    .divider-text {
      font-size: 13px;
      color: #9ca3af;
      white-space: nowrap;
    }

    /* Google button */
    .google-btn {
      width: 100%;
      height: 52px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, box-shadow 0.15s;
      font-family: inherit;
      color: #111827;
      font-size: 15px;
      font-weight: 500;
    }

    .google-btn:hover:not(:disabled) {
      background: #f9fafb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .google-btn:disabled { opacity: 0.55; cursor: wait; }

    .footer-links {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      width: 100%;
    }

    .link-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #2563eb;
      font-weight: 500;
      font-size: 13px;
      font-family: inherit;
      padding: 0;
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .loading-overlay.visible { display: flex; }

    .loading-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <span class="loading-text" id="loadingText">Connecting…</span>
    </div>
  </div>

  <div class="container">

    <!-- Logo -->
    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </linearGradient>
        </defs>
        <!-- Letter A -->
        <path d="M32 8 L52 52 H43 L38.5 40 H25.5 L21 52 H12 Z M32 20 L28 34 H36 Z" fill="url(#logoGrad)"/>
        <!-- Plane accent line -->
        <line x1="16" y1="32" x2="50" y2="20" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <polygon points="50,20 44,22 47,27" fill="url(#logoGrad)" opacity="0.7"/>
      </svg>
      <span class="logo-title">AllAbroad</span>
    </div>

    <p class="logo-sub">Plan your exchange. Explore together.</p>

    <div class="claude-note">Connecting to Claude · Sign in to continue</div>

    <div class="form-wrap">

      <!-- Error / success -->
      <div class="msg-box error"   id="errorBox"></div>
      <div class="msg-box success" id="successBox"></div>

      <!-- Tab row -->
      <div class="tab-row" id="tabRow">
        <button class="tab-btn active" id="tabSignIn" type="button">Sign In</button>
        <button class="tab-btn"        id="tabSignUp" type="button">Sign Up</button>
      </div>

      <!-- Form -->
      <form id="loginForm" method="POST" action="/oauth/login">
        <input type="hidden" name="client_id"      value="__CLIENT_ID__" />
        <input type="hidden" name="redirect_uri"   value="__REDIRECT_URI__" />
        <input type="hidden" name="state"          value="__STATE__" />
        <input type="hidden" name="code_challenge" value="__CODE_CHALLENGE__" />
        <input type="hidden" name="scope"          value="__SCOPE__" />
        <input type="hidden" name="mode"           id="modeField" value="signin" />

        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email address"
                 autocomplete="email" required />
        </div>

        <div class="field" id="passwordWrap">
          <input type="password" id="password" name="password" placeholder="Password"
                 autocomplete="current-password" />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <!-- Google button -->
      <button class="google-btn" id="googleBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span id="googleLabel">Continue with Google</span>
      </button>

      <p class="footer-links" id="footerLinks">
        Forgot password?&nbsp;<button class="link-btn" id="magicBtn">Use a magic link</button>
      </p>

    </div>
  </div>

  <script>
    // ── Config injected by the MCP server ──────────────────────────────────
    const SUPABASE_URL      = '__SUPABASE_URL__';
    const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
    const MCP = {
      client_id:      '__CLIENT_ID__',
      redirect_uri:   '__REDIRECT_URI__',
      state:          '__STATE__',
      code_challenge: '__CODE_CHALLENGE__',
      scope:          '__SCOPE__',
    };

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── DOM refs ────────────────────────────────────────────────────────────
    const $  = (id) => document.getElementById(id);
    const errorBox   = $('errorBox');
    const successBox = $('successBox');
    const submitBtn  = $('submitBtn');
    const googleBtn  = $('googleBtn');
    const overlay    = $('loadingOverlay');

    function showError(msg)   { errorBox.textContent = msg;   errorBox.classList.add('visible');   successBox.classList.remove('visible'); }
    function showSuccess(msg) { successBox.textContent = msg; successBox.classList.add('visible'); errorBox.classList.remove('visible'); }
    function clearMsgs()      { errorBox.classList.remove('visible'); successBox.classList.remove('visible'); }
    function showLoading(msg) { $('loadingText').textContent = msg || 'Connecting…'; overlay.classList.add('visible'); }

    // ── Mode state ──────────────────────────────────────────────────────────
    let mode = 'signin';

    function setMode(m) {
      mode = m;
      clearMsgs();
      $('modeField').value = m;

      const isMagic = m === 'magic';
      googleBtn.style.display     = isMagic ? 'none' : '';
      $('tabRow').style.display   = isMagic ? 'none' : '';
      $('passwordWrap').style.display = isMagic ? 'none' : '';
      submitBtn.textContent = m === 'signin' ? 'Sign In' : m === 'signup' ? 'Create Account' : 'Send Magic Link';
      $('footerLinks').innerHTML = isMagic
        ? '<button class="link-btn" id="backBtn">← Back to sign in</button>'
        : 'Forgot password?&nbsp;<button class="link-btn" id="magicBtn">Use a magic link</button>';
      bindFooter();

      [$('tabSignIn'), $('tabSignUp')].forEach(b => b && b.classList.remove('active'));
      if (m === 'signin' && $('tabSignIn')) $('tabSignIn').classList.add('active');
      if (m === 'signup' && $('tabSignUp')) $('tabSignUp').classList.add('active');
    }

    function bindFooter() {
      const magic = $('magicBtn');
      const back  = $('backBtn');
      if (magic) magic.addEventListener('click', () => setMode('magic'));
      if (back)  back.addEventListener('click', () => setMode('signin'));
    }
    bindFooter();

    $('tabSignIn').addEventListener('click', () => setMode('signin'));
    $('tabSignUp').addEventListener('click', () => setMode('signup'));

    // ── Email/password form submit ───────────────────────────────────────────
    $('loginForm').addEventListener('submit', async (e) => {
      if (mode !== 'magic') {
        clearMsgs();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Please wait…';
        return;
      }

      e.preventDefault();
      clearMsgs();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      const email = $('email').value.trim();
      if (!email) { showError('Enter your email first.'); submitBtn.disabled = false; submitBtn.textContent = 'Send Magic Link'; return; }

      const { error } = await db.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: false },
      });

      if (error) {
        showError(error.message);
      } else {
        showSuccess('Check your inbox — a magic link is on its way.');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Magic Link';
    });

    // ── Google sign-in ──────────────────────────────────────────────────────
    googleBtn.addEventListener('click', async () => {
      clearMsgs();
      googleBtn.disabled = true;
      $('googleLabel').textContent = 'Connecting…';
      showLoading('Redirecting to Google…');

      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.href,
          queryParams: { access_type: 'offline', prompt: 'select_account' },
        },
      });

      if (error) {
        overlay.classList.remove('visible');
        googleBtn.disabled = false;
        $('googleLabel').textContent = 'Continue with Google';
        showError(error.message);
      }
    });

    // ── Handle return from Google OAuth ────────────────────────────────────
    const isOAuthReturn = new URLSearchParams(window.location.search).has('code')
                       || window.location.hash.includes('access_token');

    if (isOAuthReturn) {
      showLoading('Signing you in…');
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session && isOAuthReturn) {
        showLoading('Connecting to Claude…');
        try {
          const resp = await fetch('/oauth/google-complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...MCP,
              access_token:  session.access_token,
              refresh_token: session.refresh_token,
              user_id:       session.user.id,
            }),
          });
          const data = await resp.json();
          if (data.redirect_url) {
            window.location.href = data.redirect_url;
          } else {
            overlay.classList.remove('visible');
            showError(data.error || 'Something went wrong. Please try again.');
          }
        } catch {
          overlay.classList.remove('visible');
          showError('Connection failed. Please try again.');
        }
      }
    });

    // ── Show server-injected error (from email/password POST) ───────────────
    const serverError = '__ERROR__';
    if (serverError && !serverError.includes('__ERROR__') && serverError.trim()) {
      showError(serverError);
    }
  </script>
</body>
</html>
